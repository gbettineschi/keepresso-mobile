name: Release development preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to verify without publishing (vX.Y.Z)
        required: true
        default: v0.4.3
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Swift toolchain and tagged implementation
        run: |
          test -f macos/scripts/package-release.sh
          swift --version | grep 'Swift version 6.4'
          python3 scripts/verify-upstream.py
      - name: Mac helper tests
        run: swift test --package-path macos
      - name: Package Apple silicon helper
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash macos/scripts/package-release.sh "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepresso-Mac-release
          path: macos/artifacts/KeepressoMobile.zip
          retention-days: 1
          if-no-files-found: error
  android:
    if: github.repository == 'gbettineschi/keepresso-mobile'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Check release version and package guards
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release-version.py "$TAG" >> "$GITHUB_OUTPUT"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Restore the existing owner signing key
        env:
          SIGNING_STORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          os.umask(0o077)
          if not os.environ.get('SIGNING_STORE_BASE64'):
              raise SystemExit('The retained owner signing key is required for release APKs.')
          key = Path(os.environ['RUNNER_TEMP']) / 'keepresso-release.p12'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_STORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'KEEPRESSO_SIGNING_STORE={key}\n')
          PYCODE
      - name: Test and build the signed Android release
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEEPRESSO_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEEPRESSO_SIGNING_ALIAS: keespresso-development
          KEEPRESSO_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
        run: |
          test -n "$KEEPRESSO_SIGNING_PASSWORD"
          ./gradlew --no-daemon \
            "-Pkeepresso.releaseVersion=$VERSION" "-Pkeepresso.releaseVersionCode=$VERSION_CODE" \
            "-Pkeepresso.firebase.applicationId=$FIREBASE_APPLICATION_ID" \
            "-Pkeepresso.firebase.apiKey=$FIREBASE_API_KEY" \
            "-Pkeepresso.firebase.projectId=$FIREBASE_PROJECT_ID" \
            "-Pkeepresso.firebase.senderId=$FIREBASE_SENDER_ID" \
            :core:test :app:lintRelease :app:assembleRelease
      - name: Verify signing identity and stage the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEEPRESSO_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEEPRESSO_SIGNING_ALIAS: keespresso-development
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/keepresso-mobile-v$VERSION.apk"
          python3 scripts/verify-release-apk.py "dist/keepresso-mobile-v$VERSION.apk" "$VERSION" "$VERSION_CODE" > dist/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepresso-Android-release
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/keepresso-release.p12"
  publish:
    needs: [macos, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download both verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --name Keepresso-Mac-release --dir dist
          gh run download "$GITHUB_RUN_ID" --name Keepresso-Android-release --dir dist
          (cd dist && sha256sum KeepressoMobile.zip *.apk > SHA256SUMS)
      - name: Save combined verification packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepresso-combined-verification
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - name: Publish the tagged preview
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG" KeepressoMobile.zip ./*.apk SHA256SUMS release.json \
            --verify-tag --prerelease --title "Keepresso Mobile ${TAG#v} (preview)" \
            --notes 'Personal development preview: signed Android APK plus Apple silicon Mac helper. 100% vibe-coded, provided as is. Android updates use the retained owner key. Add this GitHub repository in Obtainium and enable prereleases. Mac builds require macOS 14+ and are ad-hoc signed, not notarized. Real-device acceptance checks remain incomplete.'
  tap:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: gbettineschi/homebrew-tap/.github/workflows/publish.yml@main
    with:
      package: keepresso-mobile
      tag: ${{ github.ref_name }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
