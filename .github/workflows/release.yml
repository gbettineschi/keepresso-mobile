name: Release development preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to build (vX.Y.Z)
        required: true
        default: v0.6.13
        type: string
      mode:
        description: Verify both platforms or create an unpublished signed Mac trial
        required: true
        default: verify
        type: choice
        options: [verify, mac-trial]
      expected_sha:
        description: Exact reviewed 40-hex commit (required for mac-trial)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sign_mac: ${{ steps.policy.outputs.sign_mac }}
      build_android: ${{ steps.policy.outputs.build_android }}
      publish: ${{ steps.policy.outputs.publish }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: policy
        run: python3 scripts/release-policy.py >> "$GITHUB_OUTPUT"
      - name: Release routing and workflow boundary tests
        run: python3 -m unittest discover -s scripts/tests -v
  macos:
    needs: plan
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Verify Swift toolchain and tagged implementation
        run: |
          swift --version | grep 'Swift version 6.4'
          python3 scripts/verify-upstream.py
      - name: Mac helper tests (keyless)
        run: |
          swift test --package-path macos --no-parallel
          python3 macos/scripts/test-sign-app.py
          python3 macos/scripts/test-sign-candidate.py
          python3 macos/scripts/test-ci-project-signing.py
      - name: Package and self-check Apple silicon helper (keyless)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash macos/scripts/package-release.sh "$TAG"
      - if: needs.plan.outputs.sign_mac == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepresso-Mac-keyless-${{ github.sha }}
          path: macos/artifacts/KeepressoMobile.zip
          retention-days: 1
          if-no-files-found: error
  macos-sign:
    needs: [plan, macos]
    if: needs.plan.outputs.sign_mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    environment: macos-release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Verify immutable signing source before loading secrets
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: Keepresso-Mac-keyless-${{ github.sha }}
          path: candidate
          digest-mismatch: error
      - run: mkdir signed
      - name: Sign only; never build or execute the candidate
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          MACOS_SIGNING_PKCS12_BASE64: ${{ secrets.MACOS_SIGNING_PKCS12_BASE64 }}
          MACOS_SIGNING_PKCS12_PASSWORD: ${{ secrets.MACOS_SIGNING_PKCS12_PASSWORD }}
          MACOS_SIGNING_CERTIFICATE_SHA1: ${{ secrets.MACOS_SIGNING_CERTIFICATE_SHA1 }}
        run: python3 macos/scripts/ci-project-signing.py candidate/KeepressoMobile.zip signed/KeepressoMobile.zip --source-sha "$SOURCE_SHA" > signed/signing.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepresso-Mac-release
          path: |
            signed/KeepressoMobile.zip
            signed/signing.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary signing identity even after failure
        if: always()
        run: python3 macos/scripts/ci-project-signing.py --cleanup-only
  android:
    needs: plan
    if: needs.plan.outputs.build_android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Check release version and package guards
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release-version.py "$TAG" >> "$GITHUB_OUTPUT"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Restore the existing owner signing key
        env:
          SIGNING_STORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          os.umask(0o077)
          if not os.environ.get('SIGNING_STORE_BASE64'):
              raise SystemExit('The retained owner signing key is required for release APKs.')
          key = Path(os.environ['RUNNER_TEMP']) / 'keepresso-release.p12'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_STORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'KEEPRESSO_SIGNING_STORE={key}\n')
          PYCODE
      - name: Test and build the signed Android release
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEEPRESSO_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEEPRESSO_SIGNING_ALIAS: keespresso-development
          KEEPRESSO_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$KEEPRESSO_SIGNING_PASSWORD"
          ./gradlew --no-daemon \
            "-Pkeepresso.releaseVersion=$VERSION" "-Pkeepresso.releaseVersionCode=$VERSION_CODE" \
            :core:test :app:lintRelease :app:assembleRelease
      - name: Verify signing identity and stage the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEEPRESSO_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEEPRESSO_SIGNING_ALIAS: keespresso-development
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/keepresso-mobile-v$VERSION.apk"
          python3 scripts/verify-release-apk.py "dist/keepresso-mobile-v$VERSION.apk" "$VERSION" "$VERSION_CODE" > dist/release.json
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepresso-Android-release
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/keepresso-release.p12"
  publish:
    needs: [plan, macos-sign, android]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download both verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --name Keepresso-Mac-release --dir dist
          gh run download "$GITHUB_RUN_ID" --name Keepresso-Android-release --dir dist
          (cd dist && sha256sum KeepressoMobile.zip *.apk > SHA256SUMS)
      - name: Publish the tagged preview
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes_file="$PWD/docs/releases/${TAG#v}.md"
          if [[ -f "$notes_file" ]]; then
            notes=(--notes-file "$notes_file")
          else
            notes=(--notes 'Personal development preview. Signed Android APK and project-signed Apple silicon Mac helper (not notarized).')
          fi
          cd dist
          gh release create "$TAG" KeepressoMobile.zip ./*.apk SHA256SUMS release.json signing.json \
            --verify-tag --prerelease --title "Keepresso Mobile ${TAG#v} (preview)" \
            "${notes[@]}"
  tap:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: gbettineschi/homebrew-tap/.github/workflows/publish.yml@main
    with:
      package: keepresso-mobile
      tag: ${{ github.ref_name }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
  cleanup:
    needs: [publish, tap]
    if: always() && github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Remove transient packages after release publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
          while read -r id; do
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
