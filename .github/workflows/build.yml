name: Native companion builds

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Pinned upstream and reference vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/verify-upstream.py
      - name: Reproduce independent crypto fixtures
        run: |
          node scripts/generate-vectors.mjs
          node scripts/generate-relay-vectors.mjs
          git diff --exit-code -- shared/vectors.json shared/relay-vectors.json

  relay:
    name: Relay security and HTTP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
        working-directory: relay
      - run: npm test
        working-directory: relay

  macos:
    name: Mac helper tests and app
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Swift toolchain
        run: |
          swift --version
          xcrun --show-sdk-path
          swift --version | grep 'Swift version 6.4'
      - run: swift test --package-path macos
      - name: Package helper
        run: bash macos/scripts/build-app.sh
      - name: Safe packaged self-check
        run: macos/artifacts/KeespressoMac.app/Contents/MacOS/KeespressoMac --self-check
      - name: Archive helper
        run: ditto -c -k --sequesterRsrc --keepParent macos/artifacts/KeespressoMac.app macos/artifacts/KeespressoMac.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keespresso-Mac-development
          path: macos/artifacts/KeespressoMac.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android tests, lint and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify Android SDK 35
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Restore this owner's development signing identity
        env:
          SIGNING_STORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_STORE_BASE64" ]; then
            umask 077
            printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keespresso-development.p12"
            printf 'KEESPRESSO_SIGNING_STORE=%s\n' "$RUNNER_TEMP/keespresso-development.p12" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and assemble
        working-directory: android
        env:
          FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          KEESPRESSO_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEESPRESSO_SIGNING_ALIAS: keespresso-development
          KEESPRESSO_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          "-Pkeespresso.firebase.applicationId=$FIREBASE_APPLICATION_ID"
          "-Pkeespresso.firebase.apiKey=$FIREBASE_API_KEY"
          "-Pkeespresso.firebase.projectId=$FIREBASE_PROJECT_ID"
          "-Pkeespresso.firebase.senderId=$FIREBASE_SENDER_ID"
          :core:test :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Android-check-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keespresso-Android-development
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
