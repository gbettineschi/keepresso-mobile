name: Native companion builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contract: ${{ steps.paths.outputs.contract }}
      relay: ${{ steps.paths.outputs.relay }}
      macos: ${{ steps.paths.outputs.macos }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # PRs compare their complete diff, so a later unrelated commit cannot skip
      # a platform check that an earlier commit still needs. Pushes use the
      # preceding main revision; manual runs explicitly request all checks.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          filters: |
            contract:
              - '.github/workflows/build.yml'
              - 'scripts/verify-upstream.py'
              - 'scripts/generate-*.mjs'
              - 'shared/**'
              - 'macos/ThirdParty/**'
            relay:
              - '.github/workflows/build.yml'
              - 'relay/**'
              - 'shared/relay-vectors.json'
            macos:
              - '.github/workflows/build.yml'
              - 'macos/**'
              - 'shared/**'
            android:
              - '.github/workflows/build.yml'
              - 'android/**'
              - 'shared/**'

  contract:
    name: Pinned upstream and reference vectors
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/verify-upstream.py
      - name: Reproduce independent crypto fixtures
        run: |
          node scripts/generate-vectors.mjs
          node scripts/generate-relay-vectors.mjs
          git diff --exit-code -- shared/vectors.json shared/relay-vectors.json

  relay:
    name: Relay security and HTTP tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
        working-directory: relay
      - run: npm test
        working-directory: relay

  macos:
    name: Mac helper tests and app
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Swift toolchain
        run: |
          swift --version
          xcrun --show-sdk-path
          swift --version | grep 'Swift version 6.4'
      - run: swift test --package-path macos
      - name: Check signing policy without Keychain access
        run: python3 macos/scripts/test-sign-app.py
      - name: Package helper
        run: bash macos/scripts/build-app.sh
      - name: Safe packaged self-check
        run: macos/artifacts/KeepressoMobile.app/Contents/MacOS/KeepressoMac --self-check

  android:
    name: Android tests, lint and APK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify Android SDK 35
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Test, lint and assemble
        working-directory: android
        env:
          FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
        run: >-
          ./gradlew --no-daemon
          "-Pkeepresso.firebase.applicationId=$FIREBASE_APPLICATION_ID"
          "-Pkeepresso.firebase.apiKey=$FIREBASE_API_KEY"
          "-Pkeepresso.firebase.projectId=$FIREBASE_PROJECT_ID"
          "-Pkeepresso.firebase.senderId=$FIREBASE_SENDER_ID"
          :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: Android-check-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 1
