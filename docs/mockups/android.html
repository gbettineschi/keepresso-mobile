#keepresso-android *{box-sizing:border-box}
#keepresso-android .k-preview{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding-right:96px;margin-bottom:16px}
#keepresso-android .k-preview label{color:var(--k-muted)}
#keepresso-android .k-stage{display:flex;justify-content:center;padding:20px 10px;border-radius:20px}
#keepresso-android .k-phone{position:relative;width:384px;max-width:100%;border:1px solid var(--k-line);border-radius:30px;overflow:hidden;background:var(--k-bg);box-shadow:0 10px 30px light-dark(#30251e12,#00000033)}
#keepresso-android .k-statusbar{padding:15px 22px 8px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:500}
#keepresso-android .k-systemicons{display:flex;gap:7px;align-items:center}
#keepresso-android .k-appbar{display:flex;align-items:center;gap:10px;padding:13px 20px 12px}
#keepresso-android .k-appicon{width:40px;height:40px;object-fit:contain;flex-shrink:0}
#keepresso-android .k-appname{font-size:21px;font-weight:500;letter-spacing:-.35px}
#keepresso-android button{font:inherit;font-weight:500}
#keepresso-android button:disabled{opacity:.42}
#keepresso-android .k-iconbutton{margin-left:auto;width:42px;min-height:42px;border:0;border-radius:50%;background:transparent;color:var(--k-accent);display:grid;place-items:center}
#keepresso-android .k-main{padding:0 20px 19px;min-height:625px}
#keepresso-android .k-device{font-size:13px;font-weight:500;margin-bottom:5px}
#keepresso-android .k-hero{padding:14px 0 18px}
#keepresso-android .k-hero h2{font:inherit;font-size:31px;letter-spacing:-.8px;font-weight:400;margin:0 0 6px}
#keepresso-android .k-small{font-size:12px;color:var(--k-muted);line-height:1.45}
#keepresso-android .k-facts{padding:16px 0;border-top:1px solid var(--k-line);border-bottom:1px solid var(--k-line);margin-bottom:17px}
#keepresso-android .k-factrow{display:grid;gap:12px}
#keepresso-android .k-factrow.k-top{grid-template-columns:repeat(3,minmax(0,1fr))}
#keepresso-android .k-factrow.k-bottom{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:15px;padding-top:15px;border-top:1px solid var(--k-line)}
#keepresso-android .k-fact{min-width:0;font-size:13px}
#keepresso-android .k-factlabel{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--k-muted);margin-bottom:6px}
#keepresso-android .k-factlabel svg,#keepresso-android .k-factlabel i{color:var(--k-muted);flex-shrink:0}
#keepresso-android .k-fact strong{font-weight:500;display:block;font-variant-numeric:tabular-nums}
#keepresso-android .k-factdetail{display:block;font-size:11px;color:var(--k-muted);margin-top:4px}
#keepresso-android .k-fact.k-warm strong,#keepresso-android .k-fact.k-warm .k-factdetail,#keepresso-android .k-battery-low strong{color:light-dark(#8a6100,#f5cb5b)}
#keepresso-android .k-fact.k-hot strong,#keepresso-android .k-fact.k-hot .k-factdetail{color:light-dark(#b3332b,#ff9d90)}
#keepresso-android .k-pausedcup,#keepresso-android .k-pausedcup img{display:block;width:30px;height:30px;flex-shrink:0}
#keepresso-android .k-brewing{background:var(--k-surface);border-radius:18px;padding:17px;margin-bottom:20px}
#keepresso-android .k-sectionhead{display:flex;align-items:center;gap:9px;margin-bottom:16px}
#keepresso-android .k-sectionhead h3{font:inherit;font-size:14px;font-weight:500;margin:0}
#keepresso-android .k-runstate{font-size:11px;margin-left:auto;color:var(--k-accent);white-space:nowrap}
#keepresso-android .k-cup{display:inline-block;background:var(--k-accent);width:30px;height:30px;flex-shrink:0;mask-image:var(--k-brewing);-webkit-mask-image:var(--k-brewing);mask-size:contain;-webkit-mask-size:contain;mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat}
#keepresso-android .k-cup.k-idle{mask-image:var(--k-idle);-webkit-mask-image:var(--k-idle);background:var(--k-muted)}
#keepresso-android .k-value{font-size:25px;letter-spacing:-.65px;font-weight:400;margin-bottom:9px}
#keepresso-android .k-sessiontext{font-size:12px;color:var(--k-muted);line-height:1.6;max-width:280px}
#keepresso-android .k-triggerhead{font-size:14px;font-weight:500;margin:0 0 12px}
#keepresso-android .k-trigger{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0 14px}
#keepresso-android .k-trigger svg{color:var(--k-accent);flex-shrink:0}
#keepresso-android .k-trigger strong{font-weight:500;display:block;margin-bottom:3px}
#keepresso-android .k-triggersub{font-size:12px;color:var(--k-muted);line-height:1.5;margin-bottom:13px}
#keepresso-android .k-conditionfreshness{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;margin:0 0 12px;font-size:12px;color:var(--k-muted)}
#keepresso-android .k-conditionrefresh{border:0;background:transparent;color:var(--k-accent);font:inherit;padding:8px 0;min-height:36px}
@media(pointer:coarse){#keepresso-android .k-conditionrefresh{min-height:44px}}
#keepresso-android .k-primary,#keepresso-android .k-secondary,#keepresso-android .k-textbutton{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:45px;padding:11px 13px;font-size:13px;border-radius:13px;border:0}
#keepresso-android .k-primary{background:var(--k-accent);color:var(--k-on-accent)}
#keepresso-android .k-secondary{background:var(--k-soft);color:var(--k-accent)}
#keepresso-android .k-textbutton{background:transparent;color:var(--k-accent)}
#keepresso-android .k-manualcontrols{margin-top:15px;padding-top:15px;border-top:1px solid var(--k-line)}
#keepresso-android .k-manuallabel{display:block;font-size:13px;font-weight:500;margin-bottom:10px}
#keepresso-android .k-manualrow{display:flex;align-items:center;gap:12px}
#keepresso-android .k-stepper{display:flex;align-items:center;background:var(--k-surface);border:1px solid var(--k-line);border-radius:13px;flex-shrink:0;overflow:hidden}
#keepresso-android .k-stepper button{display:grid;place-items:center;min-width:44px;min-height:44px;padding:0;border:0;background:transparent;color:var(--k-accent)}
#keepresso-android .k-stepper output{min-width:56px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;color:var(--k-text);padding:0 4px}
#keepresso-android .k-manualrow>.k-primary{width:auto;flex:1}
#keepresso-android .k-sleep{margin-top:9px}
#keepresso-android .k-alertrow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--k-muted);margin-top:14px}
#keepresso-android .k-alertrow button{background:none;border:0;color:var(--k-accent);font-size:11px;padding:8px 0 8px 8px;margin-left:auto}
#keepresso-android .k-warning{background:var(--k-warning);color:var(--k-warning-text);padding:14px;border-radius:15px;margin-bottom:16px;font-size:12px;line-height:1.6}
#keepresso-android .k-warning strong{display:block;font-weight:500;margin-bottom:4px}
#keepresso-android .k-warning p{margin:0}
#keepresso-android .k-nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--k-surface);border-top:1px solid var(--k-line);padding:8px 9px 6px}
#keepresso-android .k-nav button{background:transparent;color:var(--k-muted);border:0;display:flex;align-items:center;flex-direction:column;gap:5px;padding:3px 6px;min-height:50px;font-size:11px}
#keepresso-android .k-nav button>span:first-child{display:grid;place-items:center;width:56px;height:27px;border-radius:15px}
#keepresso-android .k-nav button[aria-selected=true]{color:var(--k-accent)}
#keepresso-android .k-nav button[aria-selected=true]>span:first-child{background:var(--k-soft)}
#keepresso-android .k-gesture{width:95px;height:4px;background:var(--k-text);opacity:.65;border-radius:4px;margin:10px auto}
#keepresso-android .k-pageheading{font:inherit;font-size:26px;font-weight:400;letter-spacing:-.6px;margin:17px 0 22px}
#keepresso-android .k-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--k-line);font-size:13px}
#keepresso-android .k-row>div,#keepresso-android .k-row>label{min-width:0;flex:1}
#keepresso-android .k-row strong{display:block;font-weight:500;margin-bottom:5px}
#keepresso-android .k-row select{font:inherit;font-size:12px;color:var(--k-accent);background:var(--k-soft);border:0;border-radius:9px;padding:9px;max-width:116px}
#keepresso-android .k-check{accent-color:var(--k-accent);width:20px;height:20px;flex-shrink:0}
#keepresso-android .k-log{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:17px 0;border-bottom:1px solid var(--k-line);font-size:13px}
#keepresso-android .k-logtime{font-size:11px;color:var(--k-muted)}
#keepresso-android .k-log strong{display:block;font-weight:500;margin-bottom:5px}
#keepresso-android .k-notifs{background:var(--k-shade);padding:20px 15px;min-height:630px}
#keepresso-android .k-notif{background:var(--k-surface);border-radius:22px;padding:17px;margin-bottom:16px}
#keepresso-android .k-notifapp{display:flex;align-items:center;gap:7px;color:var(--k-muted);font-size:11px;margin-bottom:12px}
#keepresso-android .k-notifapp img{width:23px;height:23px;object-fit:contain}
#keepresso-android .k-notif h3{font:inherit;font-size:14px;font-weight:500;margin:0 0 8px}
#keepresso-android .k-notif p{margin:0;font-size:12px;line-height:1.65}
#keepresso-android .k-notifactions{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:13px}
#keepresso-android .k-notifactions button{border:0;background:transparent;color:var(--k-accent);padding:7px 0;min-height:36px;font-size:12px}
#keepresso-android .k-note{font-size:12px;color:var(--k-muted);line-height:1.6;margin:12px 5px}
#keepresso-android .k-toast{padding:12px 13px;border-radius:12px;margin-top:13px;background:var(--k-text);color:var(--k-bg);font-size:12px;line-height:1.5}
#keepresso-android .k-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;background:var(--k-scrim);z-index:4}
#keepresso-android .k-sheet{background:var(--k-surface);padding:25px 21px 28px;width:100%;border-radius:24px 24px 0 0}
#keepresso-android .k-sheet h3{font:inherit;font-weight:400;font-size:22px;margin:0 0 13px}
#keepresso-android .k-sheet p{font-size:13px;line-height:1.6;color:var(--k-muted);margin:0 0 20px}
#keepresso-android .k-sheet button+button{margin-top:9px}

  }
  const options=(values,selected)=>values.map(value=>'<option'+(value===selected?' selected':'')+'>'+value+'</option>').join('');
  function renderSettings(){return '<h2 class="k-pageheading">Settings</h2><div class="k-row"><div><strong>MacBook</strong><span class="k-small">This phone is authorized</span></div>'+icon('shield-check')+'</div><div class="k-row"><div><strong>Nearby connection</strong><span class="k-small">Bluetooth · reconnect automatically</span></div>'+icon('bluetooth')+'</div><div class="k-row"><label for="k-internet"><strong>Internet access</strong><span class="k-small">Use when nearby connection is unavailable</span></label><input class="k-check" id="k-internet" type="checkbox"'+(state.internet?' checked':'')+'></div><div class="k-row"><label for="k-interval"><strong>Still-running reminder</strong><span class="k-small">Only while a brewing session is running</span></label><select id="k-interval">'+options(['Every hour','Every 2 hours','Off'],state.interval)+'</select></div><div class="k-row"><label for="k-delay"><strong>Still awake after stopping</strong><span class="k-small">One warning per incident</span></label><select id="k-delay">'+options(['2 minutes','5 minutes','10 minutes'],state.delay)+'</select></div><div class="k-row"><div><strong>Routine reminders</strong><span class="k-small">'+(state.snoozed?'Snoozed until 19:30':'Enabled')+'</span></div><button type="button" class="k-iconbutton cursor-interaction" data-action="'+(state.snoozed?'resume-reminders':'snooze')+'" aria-label="'+(state.snoozed?'Resume reminders':'Snooze reminders for six hours')+'">'+icon(state.snoozed?'bell-off':'bell')+'</button></div><div class="k-row"><div><strong>Battery, heat & sleep warnings</strong><span class="k-small">Stay on during routine-reminder snoozes</span></div>'+icon('shield-check')+'</div>'+toast();}
  function renderNotifications(){
    let html='<div class="k-notifs">';
    if(!state.snoozed&&!state.acknowledged&&state.interval!=='Off')html+='<article class="k-notif"><div class="k-notifapp"><img src="'+appIcon+'" alt="Keepresso app icon">Keepresso · now</div><h3>MacBook is still awake</h3><p>The brewing session has been running for 1 hour.<br>Manual session · 1h 18m remaining.</p><div class="k-notifactions"><button type="button" class="cursor-interaction" data-action="ok">OK</button><button type="button" class="cursor-interaction" data-action="snooze">Snooze 6 hours</button><button type="button" class="cursor-interaction" data-action="open">Open</button></div></article>';
    if(!state.warningDismissed)html+='<article class="k-notif"><div class="k-notifapp"><img src="'+appIcon+'" alt="Keepresso app icon">Keepresso · needs attention</div><h3>Session ended. Mac still awake.</h3><p>The brewing session ended 5 minutes ago.<br>Closed-lid mode is still preventing sleep.</p><div class="k-notifactions"><button type="button" class="cursor-interaction" data-action="sleep">Sleep now…</button><button type="button" class="cursor-interaction" data-action="dismiss-warning">Dismiss</button><button type="button" class="cursor-interaction" data-action="open-warning">Open</button></div></article>';
    if(state.snoozed)html+='<div class="k-note">Routine reminders snoozed until 19:30.<br>Battery, heat and sleep warnings stay on.</div>';
    if(state.acknowledged&&!state.snoozed)html+='<div class="k-note">Reminder acknowledged.<br>Next regular reminder at 14:30.</div>';
    return html+toast()+'</div>';
  }
  function render(){
    picker.value=state.mode;
    let html=state.mode==='notifications'?renderNotifications():'<header class="k-appbar"><img class="k-appicon" src="'+appIcon+'" alt="Original Keepresso macOS app icon"><span class="k-appname">Keepresso</span><button type="button" class="k-iconbutton cursor-interaction" data-action="refresh" aria-label="Refresh Mac status">'+icon('refresh-cw')+'</button></header><main class="k-main">'+(state.tab==='status'?renderStatus():state.tab==='activity'?renderActivity():renderSettings())+'</main><nav class="k-nav" aria-label="App navigation">'+[['status','laptop','Status'],['activity','clock-3','Activity'],['settings','sliders-horizontal','Settings']].map(([tab,name,label])=>'<button type="button" class="cursor-interaction" data-tab="'+tab+'" aria-selected="'+(state.tab===tab)+'"><span>'+icon(name)+'</span><span>'+label+'</span></button>').join('')+'</nav>';
    if(state.dialog)html+='<div class="k-overlay"><section class="k-sheet" role="dialog" aria-modal="true" aria-labelledby="k-dialog-title"><h3 id="k-dialog-title">'+(state.dialogKind==='resume'?'Resume triggers?':'Put MacBook to sleep?')+'</h3><p>'+(state.dialogKind==='resume'?(state.matching?'The last condition check detected a working agent. The manual timer will end and triggers will take control. Conditions can change, so this is not a guarantee that the Mac will stay awake.':'No matching conditions were detected. The manual timer will end and your Mac may sleep and become unreachable.'):'Pause triggers and stop Keepresso holds before requesting sleep. Running work may pause, and the Mac will become unreachable.')+'</p>'+button(state.dialogKind==='resume'?'confirm-resume':'confirm-sleep',state.dialogKind==='resume'?'Resume triggers':'Sleep now','primary')+button('cancel','Cancel')+'<div class="k-small" style="text-align:center;margin-top:15px">Preview only · no command is sent</div></section></div>';
    content.innerHTML=html;
    if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});
  }
  picker.addEventListener('change',()=>{scenario(picker.value);render();save();});
  content.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target||target.disabled)return;
    if(target.dataset.tab){state.tab=target.dataset.tab;state.toast='';render();save();return;}
    switch(target.dataset.action){
      case 'refresh':state.toast=state.offline?'Still unreachable · readings remain last known':'Sample status refreshed';break;
      case 'refresh-conditions':if(!state.offline){state.conditionsCheckedAt='13:30';state.toast='Sample conditions refreshed';}break;
      case 'toggle-triggers':if(state.manual&&state.triggersPaused){state.dialogKind='resume';state.dialog=true;}else{state.triggersPaused=!state.triggersPaused;state.toast=state.triggersPaused?'Triggers paused.':'Triggers resumed.';}break;
      case 'confirm-resume':state.manual=false;state.triggersPaused=false;state.dialog=false;state.toast='Trigger control resumed';break;
      case 'stop-manual':state.manual=false;state.toast='Manual session stopped. Triggers remain paused.';break;
      case 'less-hours':state.hours=Math.max(0.25,Number(state.hours)-0.25);break;
      case 'more-hours':state.hours=Math.min(168,Number(state.hours)+0.25);break;
      case 'start-manual':{const hours=Number(state.hours);if(!Number.isFinite(hours)||hours<=0||hours>168){state.toast='Choose a duration greater than zero, up to 168 hours.';break;}state.manual=true;state.triggersPaused=true;state.remaining=Math.round(hours*60);state.sleepBlocked=false;state.toast='Preview: manual session started for '+formatMinutes(state.remaining);break;}
      case 'sleep':state.dialogKind='sleep';state.dialog=true;break;
      case 'cancel':state.dialog=false;break;
      case 'confirm-sleep':scenario('offline');state.justSlept=true;state.toast='Preview: sleep requested · Mac disconnected';break;
      case 'ok':state.acknowledged=true;state.toast='OK · the next regular reminder stays scheduled';break;
      case 'snooze':state.snoozed=true;state.toast='Routine reminders snoozed for 6 hours';break;
      case 'resume-reminders':state.snoozed=false;state.acknowledged=false;state.toast='Routine reminders resumed';break;
      case 'dismiss-warning':state.warningDismissed=true;state.toast='Warning dismissed. Mac state is unchanged.';break;
      case 'open':scenario('manual-resume');break;
      case 'open-warning':scenario('warning');break;
    }
    render();save();
  });
  content.addEventListener('change',event=>{if(event.target.id==='k-interval')state.interval=event.target.value;else if(event.target.id==='k-delay')state.delay=event.target.value;else if(event.target.id==='k-internet')state.internet=event.target.checked;else return;save();});
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next?.version===8&&modes.includes(next.state?.mode)){const changed=Object.keys(next.state).some(key=>key!=='dialog'&&key!=='toast'&&key!=='dialogKind'&&next.state[key]!==state[key]);if(!changed)return;Object.assign(state,next.state,{dialog:false,toast:''});render();}});
  render();
})();
</script>
